# Runs on every push and pull request, so a break shows as a red cross on GitHub instead of
# being found later. Two jobs run side by side: the server's type check and tests against a real
# PostgreSQL 18, and the client's type check, tests and production build. No test reaches a
# real upstream API: every answer comes from a recorded fixture through a fake fetch.
name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    # Every command below runs inside server/.
    defaults:
      run:
        working-directory: server
    # A throwaway PostgreSQL 18 for the tests, reachable on localhost:5432.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather_test
        ports:
          - 5432:5432
        # Waits until the database accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U weather"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The tests read DATABASE_URL; the name ends in _test, as the test guard requires.
    env:
      DATABASE_URL: postgresql://weather:weather@localhost:5432/weather_test
    steps:
      # Fetches the repository's code.
      - uses: actions/checkout@v7
      # Installs the Node version pinned in .node-version, and caches npm downloads
      # between runs using the lock file as the key.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Installs exactly what the lock file lists; postinstall generates the Prisma client.
      - run: npm ci
      # Fails the build on a high or critical advisory in a package that ships to Render.
      # Dev-only tools (Vite, Vitest, TypeScript) are left out, since they never run in production.
      - run: npm audit --omit=dev --audit-level=high
      # tsc --noEmit: Node never checks types, so this step does.
      - run: npm run typecheck
      # Vitest, once, without watching. Its global setup applies the migrations first.
      - run: npm test

  client:
    runs-on: ubuntu-latest
    # Every command below runs inside client/.
    defaults:
      run:
        working-directory: client
    steps:
      # Fetches the repository's code; the client also reads shared/types.ts from it.
      - uses: actions/checkout@v7
      # The same Node version as the server, with npm downloads cached on the client's lock file.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Installs exactly what the lock file lists.
      - run: npm ci
      # Fails the build on a high or critical advisory in a package that ships to Render.
      # Dev-only tools (Vite, Vitest, TypeScript) are left out, since they never run in production.
      - run: npm audit --omit=dev --audit-level=high
      # tsc -b over the app and the Vite config.
      - run: npm run typecheck
      # Vitest, once, on the pure logic modules.
      - run: npm test
      # The production build Render will serve, so a build break shows here first.
      - run: npm run build
